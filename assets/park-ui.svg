<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100"><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#244536}.muted{fill:#69736c}.small{font-size:19px}.body{font-size:25px}.title{font-size:40px;font-weight:600}</style><rect width="1440" height="1100" fill="#e4ecdf"/><circle cx="1280" cy="150" r="340" fill="#cddcbd"/><path d="M0 850Q700 300 1440 800" fill="none" stroke="#f7faf2" stroke-width="130"/><text x="70" y="100" font-size="24" letter-spacing="5">栖游 / PARK COMPANION</text><text x="70" y="1030" class="small">移动端概念设计 · 路线发现 / 行程决策</text>
<g transform="translate(220 170)"><rect width="440" height="760" rx="55" fill="#244536"/><rect x="12" y="12" width="416" height="736" rx="44" fill="#fafbf7"/><text x="40" y="55" class="small">9:41</text><rect x="160" y="25" width="120" height="20" rx="10" fill="#244536"/><text x="40" y="115" class="small muted">周末，去自然里走走</text><text x="40" y="170" class="title">发现一段好风景</text><rect x="35" y="200" width="370" height="58" rx="18" fill="#edf1e7"/><text x="55" y="237" class="body muted">搜索公园或路线</text><rect x="35" y="282" width="116" height="42" rx="21" fill="#244536"/><text x="59" y="310" style="fill:white" class="small">轻松散步</text><text x="174" y="310" class="small">亲子友好</text><text x="300" y="310" class="small">看植物</text><rect x="35" y="346" width="370" height="208" rx="22" fill="#c2d2b3"/><path d="M45 540Q330 420 160 350" fill="none" stroke="#f9f5df" stroke-width="30"/><g fill="#69875d"><circle cx="95" cy="400" r="34"/><circle cx="340" cy="420" r="45"/><circle cx="285" cy="495" r="25"/></g><text x="40" y="602" font-size="30">沿着水岸，慢慢走</text><text x="40" y="640" class="small muted">2.4 km · 约 45 分钟 · 平缓路线</text><path d="M35 674H405" stroke="#dce2da"/><text x="57" y="719" class="small">发现</text><text x="186" y="719" class="small muted">收藏</text><text x="314" y="719" class="small muted">我的</text></g>
<g transform="translate(770 230)"><rect width="440" height="760" rx="55" fill="#244536"/><rect x="12" y="12" width="416" height="736" rx="44" fill="#fafbf7"/><rect x="25" y="25" width="390" height="290" rx="32" fill="#d4dfc9"/><path d="M30 230Q180 70 410 190" stroke="#b5cbd0" stroke-width="65" fill="none"/><path d="M70 260Q340 300 310 85" stroke="#fff" stroke-width="16" fill="none"/><path d="M70 260Q340 300 310 85" stroke="#52774e" stroke-width="5" stroke-dasharray="10 7" fill="none"/><circle cx="70" cy="260" r="12" fill="#244536"/><circle cx="310" cy="85" r="12" fill="#244536"/><text x="40" y="370" class="title">水岸漫步</text><text x="40" y="411" class="small muted">把一个小时，留给自然。</text><text x="40" y="475" font-size="32">2.4 km</text><text x="215" y="475" font-size="32">45 min</text><text x="40" y="509" class="small muted">路线长度</text><text x="215" y="509" class="small muted">预计用时</text><path d="M35 540H405" stroke="#dce2da"/><text x="40" y="585" class="body">出发前了解</text><text x="40" y="623" class="small muted">平缓步道 · 部分路段有树荫</text><rect x="35" y="658" width="370" height="60" rx="17" fill="#244536"/><text x="167" y="697" style="fill:white" class="body">开始游览</text></g></svg>